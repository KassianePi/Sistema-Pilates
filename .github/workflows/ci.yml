name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  ci:
    name: Lint, typecheck, test e build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: pilates_ci
          MYSQL_USER: pilates_ci_user
          MYSQL_PASSWORD: pilates_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Os testes de rota do backend (*.routes.spec.ts, app.spec.ts) sobem a
      # aplicação real e conectam no MySQL do serviço acima — não usam mocks.
      DATABASE_URL: mysql://pilates_ci_user:pilates_ci_password@127.0.0.1:3306/pilates_ci
      JWT_SECRET: ci-jwt-secret-nao-usado-em-producao-32-chars
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-nao-usado-em-producao-32
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules (packages/shared)
        uses: actions/cache@v4
        with:
          path: packages/shared/node_modules
          key: shared-${{ runner.os }}-${{ hashFiles('packages/shared/package-lock.json') }}

      - name: Cache node_modules (backend)
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Cache node_modules (frontend)
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies — packages/shared
        run: npm ci
        working-directory: packages/shared

      - name: Install dependencies — backend
        run: npm ci
        working-directory: backend

      - name: Install dependencies — frontend
        run: npm ci
        working-directory: frontend

      - name: Format check — backend
        run: npm run format:check
        working-directory: backend

      - name: Format check — frontend
        run: npm run format:check
        working-directory: frontend

      - name: Lint — backend
        run: npm run lint
        working-directory: backend

      - name: Lint — frontend
        run: npm run lint
        working-directory: frontend

      - name: Typecheck — backend
        run: npm run typecheck
        working-directory: backend

      - name: Typecheck — frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -pci_root_password --silent && break
            echo "Aguardando MySQL... ($i/30)"
            sleep 2
          done

      - name: Aplicar migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Seed do banco de testes
        run: npx tsx prisma/seed.ts
        working-directory: backend

      - name: Testes — backend
        run: npm run test:coverage
        working-directory: backend

      - name: Testes — frontend
        run: npm run test:coverage
        working-directory: frontend

      - name: Build — backend
        run: npm run build
        working-directory: backend

      - name: Build — frontend
        run: npm run build
        working-directory: frontend
