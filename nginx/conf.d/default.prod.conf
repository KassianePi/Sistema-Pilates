# ============================================================================
# Configuração de PRODUÇÃO do Nginx — Studio de Pilates
# Usada apenas pelo docker-compose.prod.yml (NÃO afeta o ambiente de dev,
# que continua usando nginx/conf.d/default.conf).
#
# Pré-requisitos antes do primeiro `docker compose -f docker-compose.prod.yml up`:
#   - Certificados reais emitidos via Certbot em nginx/ssl/fullchain.pem e
#     nginx/ssl/privkey.pem (ver docs/SSL_LETSENCRYPT.md)
#   - DNS do domínio (variável DOMAIN do .env.production) apontando para o servidor
# ============================================================================

upstream backend_prod {
  server backend:3000;
}

upstream frontend_prod {
  server frontend:80;
}

# ====== HTTP — redireciona para HTTPS ======
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Necessário para emissão/renovação do certificado Let's Encrypt (modo webroot)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ====== HTTPS ======
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Headers de segurança
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Evita expor detalhes desnecessários do servidor
  server_tokens off;

  # Upload de comprovantes em base64 — alinhado ao bodyLimit do Fastify (10MB) com folga
  client_max_body_size 12m;

  # Timeouts
  proxy_connect_timeout 60s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # ---- API ----
  location /api/v1/ {
    proxy_pass http://backend_prod/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Health check — sem log de acesso (evita ruído de monitoramento)
  location /api/v1/health {
    proxy_pass http://backend_prod/api/v1/health;
    access_log off;
  }

  # ---- Swagger / documentação da API ----
  location /documentation {
    proxy_pass http://backend_prod/documentation;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- Frontend (build estático servido pelo Nginx do container frontend) ----
  location / {
    proxy_pass http://frontend_prod;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
